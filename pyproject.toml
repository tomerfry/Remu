[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "remu"
description = "Python bindings for Remu — a fast CPU emulation framework in Rust (6502, 8086, 386, x86-64, ARM7TDMI + Linux OS layers)"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["6502", "8086", "386", "x86-64", "arm", "emulator", "emulation", "cpu", "retro"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Emulators",
]
# Version comes from Cargo.toml.
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.maturin]
# `python` gates the PyO3 code in the crate; `extension-module` is enabled here
# (not in Cargo.toml) so plain `cargo test` never links against libpython.
# `symbolic-solver` adds the concolic overlay (remu.symbolic) — it pulls in no
# crate dependencies, costs nothing measurable while inactive, and only needs a
# solver binary on PATH at runtime, so the wheel always carries it.
features = ["python", "pyo3/extension-module", "symbolic-solver"]
# Mixed Rust/Python layout: the extension is `remu._remu`; the thin shim
# package in python/remu/ re-exports it as `remu`, `remu.x86`, `remu.arm32`, …
module-name = "remu._remu"
python-source = "python"
