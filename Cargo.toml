[package]
name = "remu"
version = "0.1.0"
edition = "2024"

[lib]
name = "remu"
path = "src/lib.rs"
# `cdylib` is only used when building the Python extension via maturin; plain
# cargo builds/tests use the rlib.
crate-type = ["rlib", "cdylib"]

[[bin]]
# Named distinctly from the lib: with `crate-type = ["cdylib", ...]` both
# targets would otherwise emit colliding `remu.pdb` files on MSVC.
name = "remu-cli"
path = "src/main.rs"

[[bin]]
# Linux i386 user-mode runner (qemu-user style).
name = "remu-user"
path = "src/bin/remu-user.rs"

[[bin]]
# Linux x86-64 OS-emulation runner (qiling-style, hardware paging).
name = "remu-user64"
path = "src/bin/remu-user64.rs"

[dependencies]
bitflags = "2"
pyo3 = { version = "0.29.0", features = ["abi3-py39"], optional = true }
# Runtime x86-64 assembler for the optional template JIT (feature `jit`).
dynasm = { version = "3", optional = true }
dynasmrt = { version = "3", optional = true }

[dev-dependencies]
criterion = "0.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The SingleStepTests 8088 suite ships gzipped JSON.
flate2 = "1"

[[bench]]
name = "cpu"
harness = false

[profile.release]
debug = true
lto = true
codegen-units = 1

[features]
# Python bindings (PyO3). Off by default so `cargo build`/`cargo test` never
# touch libpython; maturin enables it (plus `pyo3/extension-module`) — see
# pyproject.toml.
python = ["dep:pyo3"]
# Decode/dispatch profile counters on the 386, x86-64 and ARM32 cores, for
# the performance work: `cargo run --release --features perf-stats --example
# bench_x86`. Off by default; compiles to nothing.
perf-stats = []
# Template JIT (dynamic binary translation) for the x86-64 and 80386 cores,
# reached via `Cpu::run`. Host must be x86-64. The interpreter stays the
# reference; off by default. See src/x86_64/jit/ and src/x86_32/jit/.
jit = ["dep:dynasm", "dep:dynasmrt"]
# Symbolic (concolic) execution overlay for the 80386 core: a sparse bitvector
# expression shadow tracked alongside the concrete interpreter, for collecting
# path constraints and solving for inputs. Off by default; no runtime deps (the
# SMT solver arrives later behind a nested `symbolic-solver` feature). See
# src/symbolic/.
symbolic = []
